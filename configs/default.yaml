project:
  name: AI-Aquatica-RS

data:
  dataset_path: data/example.csv
  date_column: date
  target_column: target
  station_id_column: station_id

features:
  feature_columns:
    - feature_a
    - feature_b
    - feature_c

runtime:
  random_state: 42
  output_dir: outputs
  nearest_days_tolerance: 3
  models:
    - median
    - mean
    - linear_regression
    - ridge
    - knn
    - random_forest
    - extra_trees
    - hist_gradient_boosting
